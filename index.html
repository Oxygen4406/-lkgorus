<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Küçük Hikayemiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffeef2;
            --primary: #ff4b72;
            --text-color: #5a3e49;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ffeef2 0%, #ffd6e0 100%); color: var(--text-color); min-height: 100vh; overflow-x: hidden; display: flex; justify-content: center; align-items: center; }
        
        .page { display: none; width: 100%; max-width: 420px; min-height: 100vh; padding: 25px 20px; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .page.active { display: flex; }

        h2 { font-family: 'Caveat', cursive; color: var(--primary); font-size: 2.2rem; margin-bottom: 10px; }
        p { font-size: 0.95rem; line-height: 1.5; color: #7a5c68; }
        
        /* PIN EKRANI */
        .pin-dots { display: flex; gap: 12px; margin: 25px 0 35px; justify-content: center; }
        .dot { width: 16px; height: 16px; border: 2px solid var(--primary); border-radius: 50%; background: transparent; transition: 0.2s; }
        .dot.filled { background: var(--primary); }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 280px; margin: 0 auto; }
        .key { background: white; border-radius: 15px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.3rem; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .key:active { background: #ffe3ec; transform: scale(0.92); }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: 600; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="page active" id="page-pin">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">💖</div>
        <h2>Senin İçin</h2>
        <p>Bu kalbin anahtarı sende — PIN'i gir de açılsın</p>
        
        <div class="pin-dots">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
            <div class="dot" id="dot-5"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
            <div class="key" onclick="pressKey('5')">5</div>
            <div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div>
            <div class="key" onclick="pressKey('8')">8</div>
            <div class="key" onclick="pressKey('9')">9</div>
            <div class="key" onclick="clearPin()">❌</div>
            <div class="key" onclick="pressKey('0')">0</div>
            <div class="key" onclick="clearPin()">🔒</div>
        </div>
    </div>

    <div class="page" id="page-welcome">
        <h2>Tebrikler Aşkım! 🎉</h2>
        <p>Şifreyi doğru girdin, hikayemize hoş geldin!</p>
    </div>

    <script>
        var TARGET_PIN = "180526";
        var currentPin = "";

        function pressKey(num) {
            if (currentPin.length < 6) {
                currentPin += num;
                updateDots();

                if (currentPin.length === 6) {
                    if (currentPin === TARGET_PIN) {
                        setTimeout(function() {
                            document.getElementById('page-pin').classList.remove('active');
                            document.getElementById('page-welcome').classList.add('active');
                        }, 200);
                    } else {
                        setTimeout(function() {
                            alert("Hatalı Şifre!");
                            clearPin();
                        }, 200);
                    }
                }
            }
        }

        function clearPin() {
            currentPin = "";
            updateDots();
        }

        function updateDots() {
            for (var i = 0; i < 6; i++) {
                var dot = document.getElementById('dot-' + i);
                if (i < currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }
    </script>
</body>
</html>
